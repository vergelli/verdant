name: Release

# Builds an ESOUI-ready zip and creates a GitHub Release.
#
# Triggered automatically when a tag matching `v*` is pushed (e.g. v1.1.0),
# or manually via the Actions tab if a release needs to be re-built.
#
# Output: Verdant-<version>.zip attached to the GitHub Release page,
# with the matching CHANGELOG section as release notes.  ESOUI upload is
# still manual — there is no public API for it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package (without v prefix, e.g. 1.1.0)'
        required: true
        type: string

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Lint manifest (ESOUI §0 hard rules)
        # UTF-8 without BOM, every line <= 301 bytes, APIVersion has 1-2 values.
        run: |
          MANIFEST=Verdant.txt
          if [ "$(head -c3 "$MANIFEST" | od -An -tx1 | tr -d ' ')" = "efbbbf" ]; then
            echo "::error::$MANIFEST has a UTF-8 BOM — must be UTF-8 without BOM"
            exit 1
          fi
          LC_ALL=C awk '{ if (length($0) > 301) { printf "::error::%s line %d is %d bytes (>301)\n", FILENAME, NR, length($0); bad=1 } } END { exit bad }' "$MANIFEST"
          APICOUNT=$(grep -E '^## APIVersion:' "$MANIFEST" | sed -E 's/^## APIVersion:[[:space:]]*//' | wc -w)
          if [ "$APICOUNT" -lt 1 ]; then echo "::error::APIVersion directive missing or empty"; exit 1; fi
          if [ "$APICOUNT" -gt 2 ]; then echo "::error::APIVersion has $APICOUNT values — max 2 (3+ are ignored by the parser)"; exit 1; fi
          echo "Manifest lint passed (no BOM, lines <=301, APIVersion=$APICOUNT value(s))."

      - name: Verify manifest version matches tag
        run: |
          MANIFEST=$(grep -E '^## Version:' Verdant.txt | sed -E 's/## Version:\s*//')
          if [ "$MANIFEST" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Verdant.txt Version ($MANIFEST) does not match tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Verify constants.lua VERSION matches tag
        run: |
          CONST=$(grep -E '^\s*VERSION\s*=' core/constants.lua | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$CONST" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::core/constants.lua VERSION ($CONST) does not match tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Stage release files
        # Only files referenced by the manifest end up in the zip.
        # README / CHANGELOG / LICENSE live in the GitHub repo — the user's
        # AddOns/ folder should stay clean.  docs/, specs/, test/, .github/
        # are dev-only and excluded for the same reason.
        #
        # If you add a new top-level directory, add it here.  Manifest is
        # the source of truth — anything it loads needs to be in this list.
        run: |
          mkdir -p staging/Verdant
          cp -r \
            assets \
            bindings.xml \
            locales \
            core \
            lib \
            zenimax \
            observability \
            pipeline \
            ui \
            Verdant.lua \
            Verdant.txt \
            staging/Verdant/

      - name: Verify staged textures
        # assets/ is referenced by XML (Verdant/assets/glow.dds, logo.dds) but
        # is NOT in the manifest file list — forgetting it ships a broken glow.
        # Fail loudly if any XML-referenced texture is missing from staging.
        run: |
          missing=0
          refs=$(grep -rhoE 'Verdant/assets/[A-Za-z0-9_./-]+\.dds' ui/ | sort -u)
          if [ -z "$refs" ]; then echo "::warning::no Verdant/assets textures referenced in ui/ XML"; fi
          for ref in $refs; do
            rel="${ref#Verdant/}"
            if [ -f "staging/Verdant/$rel" ]; then
              echo "ok: $rel"
            else
              echo "::error::texture referenced in XML is missing from the zip: $rel"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Verify folder casing
        # ESOUI moderation flags zips whose top-level folder does not match
        # the manifest filename exactly (Verdant ≠ verdant).  Linux is
        # case-sensitive so this check is reliable here.
        run: |
          if [ ! -d "staging/Verdant" ]; then
            echo "::error::Top-level folder must be exactly 'Verdant'"
            exit 1
          fi

      - name: Build zip
        run: |
          cd staging
          zip -r "../Verdant-${{ steps.version.outputs.version }}.zip" Verdant/
          cd ..
          unzip -l "Verdant-${{ steps.version.outputs.version }}.zip"

      - name: Extract release notes from CHANGELOG
        # Pull the section for this version out of CHANGELOG.md so the
        # GitHub Release body mirrors the changelog automatically.
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Match "## [VERSION]" up to (but not including) the next "## ["
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { capture=1; next }
            capture && /^## \[/    { exit }
            capture                { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Section [$VERSION] not found in CHANGELOG.md, falling back to default notes"
            echo "Verdant $VERSION" > release_notes.md
          fi
          echo "----- release notes preview -----"
          cat release_notes.md
          echo "---------------------------------"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Verdant ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: Verdant-${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false

      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Verdant-${{ steps.version.outputs.version }}
          path: Verdant-${{ steps.version.outputs.version }}.zip
